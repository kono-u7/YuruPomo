<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f0" />
    <title>ひといき</title>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>ひといき</h1>
          <p class="sub">ポモドーロタイマー</p>
        </div>
      </header>

      <section class="timer" aria-live="off">
        <div class="ring">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="46" fill="none" stroke="var(--ring)" stroke-width="3" />
            <circle id="arc" cx="50" cy="50" r="46" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0" />
          </svg>
          <div class="t" id="time">25:00</div>
        </div>
        <div class="now"><b id="nowName"></b><div id="nowSub"></div></div>
      </section>

      <div class="btns">
        <button class="go" id="go">このタスクをはじめる</button>
        <button class="rs" id="rs" aria-label="リセット">↺</button>
      </div>

      <div class="lh"><h2>今日の流れ</h2><span id="count"></span></div>
      <ul id="list"></ul>

      <div class="add">
        <input type="text" id="nm" placeholder="タスク名を入力" maxlength="30" />
        <input type="number" id="nv" value="25" min="1" max="999" inputmode="numeric" aria-label="数" />
        <div class="seg" id="seg">
          <button class="on" data-k="minutes">分</button>
          <button data-k="pages">ページ</button>
        </div>
        <button class="plus" id="plus">＋ 追加</button>
      </div>

      <section class="ai">
        <h3>予定が変わったら、ここに。</h3>
        <p>やりたいことや締切を書くと、AIが今日の流れを提案します。</p>
        <textarea id="ask" placeholder="例：甘いものが食べたい／外の空気を吸いたい"></textarea>
        <button class="go" id="ask-go">AIに予定を相談する</button>
        <div id="msg" role="status"></div>
        <section class="proposal" id="proposal" hidden aria-live="polite">
          <h3>AIからの提案</h3>
          <p id="proposal-summary"></p>
          <ul class="proposal-list" id="proposal-tasks"></ul>
          <div class="questions" id="proposal-questions" hidden>
            <strong>確認したいこと</strong>
            <ul id="questions-list"></ul>
          </div>
          <div class="proposal-actions">
            <button class="plus" id="apply-proposal">この内容を今日の流れに反映</button>
            <button class="dismiss" id="dismiss-proposal">閉じる</button>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
