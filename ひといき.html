<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひといき</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f0;--card:#fffdf9;--line:#efe4d6;--sel:#f6e3d8;--selline:#e2b9a5;--text:#4a3a31;--sub:#9a8678;--acc:#b85c40;--accfg:#fff;--chip:#efe6da;--chipg:#e6ecdd;--ai:#f1e6d9;--ring:#f1e3d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#271f1a;--line:#3a2f27;--sel:#3b2a22;--selline:#7a4b39;--text:#f3ebe2;--sub:#a8978a;--acc:#d9805f;--accfg:#1c1713;--chip:#352b24;--chipg:#2d3427;--ai:#2f2620;--ring:#3a2f27;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1713;--card:#271f1a;--line:#3a2f27;--sel:#3b2a22;--selline:#7a4b39;--text:#f3ebe2;--sub:#a8978a;--acc:#d9805f;--accfg:#1c1713;--chip:#352b24;--chipg:#2d3427;--ai:#2f2620;--ring:#3a2f27;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif}
main{max-width:430px;margin:0 auto;padding:18px 20px 28px}
h1{font-size:24px;margin:0;font-weight:700}
.sub{font-size:11px;color:var(--sub);margin:2px 0 0}
header{display:flex;justify-content:space-between;align-items:flex-start}
.timer{display:flex;flex-direction:column;align-items:center;margin:14px 0 12px}
.ring{position:relative;width:min(68vw,270px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(44px,15vw,60px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.now{text-align:center;margin-top:10px}
.now b{font-size:20px}
.now div{font-size:12px;color:var(--sub);margin-top:2px}
.btns{display:flex;gap:10px;margin:14px 0 20px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.go{flex:1;height:52px;border-radius:26px;background:var(--acc);color:var(--accfg);font-size:15px;font-weight:700}
.rs{width:52px;height:52px;border-radius:50%;background:var(--chip);font-size:20px}
h2{font-size:17px;margin:0}
.lh{display:flex;justify-content:space-between;align-items:baseline}
.lh span{font-size:11px;color:var(--sub)}
ul{list-style:none;margin:12px 0;padding:0;display:grid;gap:9px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer}
li.sel{background:var(--sel);border-color:var(--selline)}
li.done{opacity:.5}
li.done .nm{text-decoration:line-through}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--sub);background:none;flex:none;position:relative}
li.done .ck{background:var(--acc);border-color:var(--acc)}
li.done .ck::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--accfg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.tx{flex:1;min-width:0}.nm{font-weight:700;font-size:15px}
.chip{background:var(--chip);border-radius:14px;padding:7px 16px;font-size:13px;font-weight:500}
.chip.p{background:var(--chipg)}
.x{background:none;color:var(--sub);font-size:18px;padding:4px 6px}
.add{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.add input[type=text]{flex:1 1 100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:14px;padding:10px 2px}
.add input[type=number]{width:62px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);text-align:center;font:inherit;font-size:16px}
.seg{display:flex;flex:1;background:var(--chip);border-radius:12px;padding:3px}
.seg button{flex:1;border-radius:10px;background:none;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--acc);font-weight:700}
.plus{height:46px;padding:0 20px;border-radius:14px;background:var(--acc);color:var(--accfg);font-weight:700;font-size:14px}
.ai{margin-top:18px;background:var(--ai);border-radius:20px;padding:16px}
.ai h3{margin:0;font-size:16px}
.ai p{margin:2px 0 10px;font-size:11px;color:var(--sub)}
.ai textarea{width:100%;height:76px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:inherit;font-size:14px;padding:12px;resize:none}
.ai .go{width:100%;margin-top:10px;height:48px}
#msg{font-size:12px;color:var(--sub);text-align:center;margin:8px 0 0;min-height:1.4em}
</style>
</head>
<body>
<main>
<header><div><h1>ひといき</h1><p class="sub">ポモドーロタイマー</p></div></header>

<section class="timer" aria-live="off">
<div class="ring">
<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--ring)" stroke-width="3"/><circle id="arc" cx="50" cy="50" r="46" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"/></svg>
<div class="t" id="time">25:00</div>
</div>
<div class="now"><b id="nowName"></b><div id="nowSub"></div></div>
</section>

<div class="btns"><button class="go" id="go">このタスクをはじめる</button><button class="rs" id="rs" aria-label="リセット">↺</button></div>

<div class="lh"><h2>今日の流れ</h2><span id="count"></span></div>
<ul id="list"></ul>

<div class="add">
<input type="text" id="nm" placeholder="タスク名を入力" maxlength="30">
<input type="number" id="nv" value="25" min="1" max="999" inputmode="numeric" aria-label="数">
<div class="seg" id="seg"><button class="on" data-k="m">分</button><button data-k="p">ページ</button></div>
<button class="plus" id="plus">＋ 追加</button>
</div>

<section class="ai">
<h3>予定が変わったら、ここに。</h3>
<p>やりたいことや希望を書くと、今日の流れに差し込みます。</p>
<textarea id="ask" placeholder="例：甘いものが食べたい／外の空気を吸いたい"></textarea>
<button class="go" id="ask-go">今日の流れを見直す</button>
<div id="msg"></div>
</section>
</main>

<script>
(function(){
var tasks=[{n:'仕事',k:'m',v:25},{n:'読書',k:'p',v:10},{n:'仕事',k:'m',v:40}].map(function(t,i){t.id=i+1;t.done=false;return t});
var nextId=4,selId=1,run=false,endAt=0,left=0,since=0,paused=0,addKind='m',timerId=null;
var $=function(i){return document.getElementById(i)};
function cur(){return tasks.filter(function(t){return t.id===selId})[0]||null}
function fmt(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function label(t){return t.k==='m'?t.v+'分':t.v+'ページ'}
function reset(){run=false;clearInterval(timerId);var t=cur();left=t&&t.k==='m'?t.v*60:0;paused=0;draw()}
function select(id){selId=id;reset()}
function pickNext(){var n=tasks.filter(function(t){return !t.done})[0];selId=n?n.id:0;reset()}
function notify(t){try{if(navigator.vibrate)navigator.vibrate([200,100,200]);if('Notification' in window&&Notification.permission==='granted')new Notification('ひといき',{body:t.n+'、おつかれさまでした。'})}catch(e){}}
function tick(){var t=cur();if(!t)return;if(t.k==='m'){left=(endAt-Date.now())/1000;if(left<=0){t.done=true;notify(t);pickNext();return}}else{paused=(Date.now()-since)/1000}draw()}
$('go').onclick=function(){var t=cur();if(!t)return;
if(run){run=false;clearInterval(timerId);if(t.k==='m')left=(endAt-Date.now())/1000;else paused=(Date.now()-since)/1000;draw();return}
try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
run=true;if(t.k==='m')endAt=Date.now()+left*1000;else since=Date.now()-paused*1000;
timerId=setInterval(tick,500);draw()};
$('rs').onclick=reset;
function draw(){var t=cur();
$('nowName').textContent=t?t.n+'・'+label(t):'おつかれさまでした';
$('nowSub').textContent=!t?'今日の流れはぜんぶ終わりました':t.k==='m'?(run?'集中しているところ':'目の前のことだけ。'):'読み終えたら、左の○をタップ';
var sec=!t?0:t.k==='m'?left:paused;$('time').textContent=fmt(sec);
var p=!t?1:t.k==='m'?1-left/(t.v*60):Math.min(1,paused/(t.v*60));
$('arc').setAttribute('stroke-dashoffset',String(289*(1-Math.max(0,Math.min(1,p)))));
$('go').textContent=!t?'完了':run?'一時停止':'このタスクをはじめる';
$('go').disabled=!t;
$('count').textContent=tasks.length+'件・上から順に';
var ul=$('list');ul.textContent='';
tasks.forEach(function(x){var li=document.createElement('li');li.className=(x.id===selId?'sel ':'')+(x.done?'done':'');
var ck=document.createElement('button');ck.className='ck';ck.setAttribute('aria-label','完了にする');
ck.onclick=function(e){e.stopPropagation();x.done=!x.done;if(x.done&&x.id===selId)pickNext();else draw()};
var tx=document.createElement('div');tx.className='tx';var nm=document.createElement('div');nm.className='nm';nm.textContent=x.n;tx.appendChild(nm);
var ch=document.createElement('span');ch.className='chip'+(x.k==='p'?' p':'');ch.textContent=label(x);
var del=document.createElement('button');del.className='x';del.textContent='×';del.setAttribute('aria-label','削除');
del.onclick=function(e){e.stopPropagation();tasks=tasks.filter(function(y){return y!==x});if(x.id===selId)pickNext();else draw()};
li.onclick=function(){select(x.id)};li.appendChild(ck);li.appendChild(tx);li.appendChild(ch);li.appendChild(del);ul.appendChild(li)})}
$('seg').onclick=function(e){var b=e.target.closest('button');if(!b)return;addKind=b.dataset.k;[].forEach.call($('seg').children,function(c){c.classList.toggle('on',c===b)});$('nv').value=addKind==='m'?25:10};
$('plus').onclick=function(){var n=$('nm').value.trim();var v=parseInt($('nv').value,10);if(!n||!(v>0)){$('msg').textContent='タスク名と数を入れてください。';return}
tasks.push({id:nextId++,n:n,k:addKind,v:v,done:false});$('nm').value='';$('msg').textContent='';if(!cur()||cur().done)pickNext();else draw()};
var rules=[[/甘|おやつ|スイーツ|お菓子/,'おやつ',10],[/外|散歩|空気/,'散歩',15],[/ご飯|ごはん|昼|夕|食事|お腹/,'ごはん',30],[/休憩|休み|疲れ|ひと息/,'休憩',10]];
$('ask-go').onclick=function(){var s=$('ask').value;var hits=rules.filter(function(r){return r[0].test(s)});
if(!hits.length){$('msg').textContent='試作版は「甘いもの」「散歩」「ごはん」「休憩」に反応します。';return}
var i=tasks.map(function(t){return t.id}).indexOf(selId);var at=i<0?tasks.length:i+1;
hits.forEach(function(r){tasks.splice(at++,0,{id:nextId++,n:r[1],k:'m',v:r[2],done:false})});
$('ask').value='';$('msg').textContent=hits.map(function(r){return r[1]}).join('、')+'を差し込みました。';draw()};
reset();
})();
</script>
</body>
</html>
